device: "local"         # [jinsi local]
################################################# jinsi配置
job_name: "bigtrain"
node_num: 1             # n=1 单机 n>1  多机-需要指定node_list
node_gpu: 1             # gpu个数
################################################# 训练配置
# One entry = one dataset/head, regardless of the number of .aselmdb shards.
# num_heads must equal len(datasets), otherwise startup fails before loading data.
num_heads: 9
readout_hidden: 64     # hidden width PER head; total hidden width = 64 * num_heads
use_spin_charge: true
datasets:
  - name: omat_pbe
    train_path: "/home15/liangqm/NNP-DATASET/omat-unzip/train"
    valid_path: "/home15/liangqm/NNP-DATASET/omat-unzip/val"
    pbc: true         # true = TTT (including slabs in 3-D vacuum cells); false = FFF
    e0_yaml_path: "./config/e0_omat.yaml"
# Add another entry and increment num_heads, e.g.:
  - name: oc20
    train_path: "/home15/liangqm/NNP-DATASET/OC20/OC20-OC20mAds/oc20_total_train"
    valid_path: "/home15/liangqm/NNP-DATASET/OC20/OC20-OC20mAds/oc20_val"  # empty: split this dataset using train_percent/valid_percent
    pbc: true       # slab in a 3-D vacuum cell; missing stress is masked in training
    e0_yaml_path: "./config/e0_oc20.yaml"
  - name: omol25
    train_path: "/home15/liangqm/NNP-DATASET/OMol25_official/OMol-1-OPoly26/all_train"
    valid_path: "/home15/liangqm/NNP-DATASET/OMol25_official/OMol-1-OPoly26/all_val"  # empty: split this dataset using train_percent/valid_percent
    pbc: false       # slab in a 3-D vacuum cell; missing stress is masked in training
    e0_yaml_path: "./config/e0_omol25.yaml"
  - name: salexmp
    train_path: "/home15/liangqm/NNP-DATASET/salex-mptraj/train"
    valid_path: "/home15/liangqm/NNP-DATASET/salex-mptraj/val"  # empty: split this dataset using train_percent/valid_percent
    pbc: true       # slab in a 3-D vacuum cell; missing stress is masked in training
    e0_yaml_path: "./config/e0_salex.yaml"
  - name: omc25
    train_path: "/home15/liangqm/NNP-DATASET/OMC25/train"
    valid_path: "/home15/liangqm/NNP-DATASET/OMC25/val"  # empty: split this dataset using train_percent/valid_percent
    pbc: true       # slab in a 3-D vacuum cell; missing stress is masked in training
    e0_yaml_path: "./config/e0_omc25.yaml"
  - name: oc25
    train_path: "/home15/liangqm/NNP-DATASET/OC25/train"
    valid_path: "/home15/liangqm/NNP-DATASET/OC25/val"  # empty: split this dataset using train_percent/valid_percent
    pbc: true       # slab in a 3-D vacuum cell; missing stress is masked in training
    e0_yaml_path: "./config/e0_oc25.yaml"
  - name: matpesr2scan
    train_path: "/home15/liangqm/NNP-DATASET/MatPES-R2SCAN/train_lmdb"
    valid_path: "/home15/liangqm/NNP-DATASET/MatPES-R2SCAN/valid_lmdb"  # empty: split this dataset using train_percent/valid_percent
    pbc: true       # slab in a 3-D vacuum cell; missing stress is masked in training
    e0_yaml_path: "./config/e0_matpes.yaml"
  - name: oc22
    train_path: "/home15/liangqm/NNP-DATASET/OC22/alltrainvalid/train"
    valid_path: "/home15/liangqm/NNP-DATASET/OC22/alltrainvalid/val_ood"  # empty: split this dataset using train_percent/valid_percent
    pbc: true       # slab in a 3-D vacuum cell; missing stress is masked in training
    e0_yaml_path: "./config/e0_oc22.yaml"
  - name: odac25
    train_path: "/home15/liangqm/NNP-DATASET/ODAC25/train"
    valid_path: "/home15/liangqm/NNP-DATASET/ODAC25/val"  # empty: split this dataset using train_percent/valid_percent
    pbc: true       # slab in a 3-D vacuum cell; missing stress is masked in training
    e0_yaml_path: "./config/e0_odac25.yaml"

compile_training: true  # Experimental make_fx + Inductor; separate train/eval graphs, each compiled on first use.
batch_size: 128
train_percent: 0.95
valid_percent: 0.05
# retrain and finetune
resume: False
resume_path: "./model_pth/512_2_128_checkpoint_last.pt"
finetune: True
finetune_path: "./model_pth/512_2_128_valid_1E1F1S_omat.pth"     # finetune=True 时必须明确指定
finetune_reset_e0: True  # 头数不增时可选重建 E0；头数增加时强制重建全部 E0 和 readout
# common
max_lr: 0.001
min_lr: 0.00001
warmup_factor: 0.1   
warmup_epochs: 0.2    
wsd_decay_ratio: 0.65  # DPA4: stable phase, then cosine decay over the final 65% of steps
max_clip: 10.0
epoch_num: 10      
# 模型配置
cutoff: 6.0
num_rbf: 16
node_dim: 512
num_layers: 2
max_l: 1
max_ell: 3
use_zbl: True
pair_dim: 128
edge_weight_dim: 96
# loss 系数
E_factor: 1
F_factor: 1
S_factor: 1
