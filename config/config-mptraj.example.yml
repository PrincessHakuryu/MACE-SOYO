# Single-head MPtraj training: 100 epochs, batch_size=48 per GPU.
# One dataset entry per training head. Replace the dataset paths before training.
# Fresh and finetuned models require num_heads == len(datasets).
# Finetune keeps only declared heads. Same names copy their old readouts;
# new names copy the sole old head, or specify finetune_head for a multihead source.
num_heads: 1
use_spin_charge: false
readout_hidden: 64
datasets:
  - name: mptraj
    # finetune_head: omat_pbe  # Optional source head override when finetune is true.
    train_path: /path/to/mptraj/train
    valid_path: ""
    pbc: true
    e0_yaml_path: ./config/e0_mptraj.yaml

compile_training: true
model_dtype: float32    # Data, E0 and losses always use FP64.
batch_size: 48
train_percent: 0.95
valid_percent: 0.05
resume: false
resume_path: ./model_pth/512_2_128_checkpoint_last.pt
finetune: false
finetune_path: ./model_pth/512_2_128_valid_1E1F1S.pth
finetune_reset_e0: false  # False: copy source-head E0. True: use each target's YAML E0.
max_lr: 0.001
min_lr: 0.00001
warmup_factor: 0.1
warmup_epochs: 0.2
wsd_decay_ratio: 0.65
max_clip: 10.0
epoch_num: 100
cutoff: 6.0
num_rbf: 16
node_dim: 512
num_layers: 2
max_l: 1
max_ell: 3
max_correlations: 3  # Maximum symmetric-contraction degree in each layer.
use_zbl: true
pair_dim: 128
edge_weight_dim: 96
E_factor: 1
F_factor: 1
S_factor: 1
